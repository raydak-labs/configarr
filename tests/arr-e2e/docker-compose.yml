# Shared API key for all fixtures (must match config.ts E2E_API_KEY).
# Named volumes hold the DBs; only /data/e2e[-b] is bind-mounted, so PUID/PGID must be
# the host user (`PUID=$(id -u) PGID=$(id -g)`) or *arr rejects the root folders.
# Sonarr/Radarr/Readarr/Lidarr/Prowlarr take their API key from `<APP>__AUTH__*`.
# Whisparr's eros base ignores env overrides, so it seeds a fixture config.xml instead.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:386c962ee6e260e3a5656b25df2ed056bcc9b6410e197d075f9547fd14c23bca
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - SONARR__APP__INSTANCENAME=Sonarr
      - SONARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - SONARR__AUTH__METHOD=External
      - SONARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - sonarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "18989:8989"

  # v5-nightly. develop-<version>-ls<rev> keeps Renovate off the stable 4.x tags.
  sonarr-v5:
    image: lscr.io/linuxserver/sonarr:develop-5.0.0.2941-ls207@sha256:b0cb42e70dd48860bbf3a8aa87dfa8c1a6ae56c1c96c8200923e821caad72a59
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - SONARR__APP__INSTANCENAME=Sonarr v5
      - SONARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - SONARR__AUTH__METHOD=External
      - SONARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - sonarr-v5-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "18990:8989"

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - RADARR__APP__INSTANCENAME=Radarr
      - RADARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - radarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "17878:7878"

  radarr-v5:
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - RADARR__APP__INSTANCENAME=Radarr v5
      - RADARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - radarr-v5-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "17879:7878"

  # develop line for the 7.0.0.10815 API. Refresh tag, digest, and generate-api.ts together.
  radarr-v7:
    image: lscr.io/linuxserver/radarr:develop-7.0.0.10815-ls275@sha256:3aae9e841647fb54777ca38fab50cb5b1fdeec8a4b6aca252583a354be1a442e
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - RADARR__APP__INSTANCENAME=Radarr v7
      - RADARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - radarr-v7-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "17880:7878"

  # Whisparr v3 (eros) is the image upstream recommends. Its base predates the sectioned env
  # overrides and generates a random API key, so the fixture config.xml is copied into the
  # volume before the app starts. The v2 line (v2-2.2.0-release.231) passes this suite too.
  whisparr:
    image: ghcr.io/hotio/whisparr:v3-3.6.5-release.1886@sha256:5fb39f643946bc3872b105988ba81679318cc534431eafb44d8e24f8fdaa864e
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - whisparr-data:/config
      - ./fixtures/whisparr-config/config.xml:/seed/config.xml:ro
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    entrypoint: ["/bin/sh", "-c", 'cp /seed/config.xml /config/config.xml && chown "$$PUID:$$PGID" /config/config.xml && exec /init']
    ports:
      - "16969:6969"

  readarr:
    image: lscr.io/linuxserver/readarr:develop-0.4.18.2805-ls157@sha256:baf471a7101b58f361ef960de91cd15f23bae82d0126df6a9edbeaf5c5aa4392
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - READARR__APP__INSTANCENAME=Readarr
      - READARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - READARR__AUTH__METHOD=External
      - READARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - readarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "18787:8787"

  # Nightly required for protocol items[] (#481)
  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - LIDARR__APP__INSTANCENAME=Lidarr
      - LIDARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - LIDARR__AUTH__METHOD=External
      - LIDARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - lidarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "18686:8686"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - PROWLARR__APP__INSTANCENAME=Prowlarr
      - PROWLARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - PROWLARR__AUTH__METHOD=External
      - PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - prowlarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "19696:9696"

  # Indexer proxy for Prowlarr e2e (same image as examples/full). Not a download client.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    ports:
      - "18191:8191"

volumes:
  sonarr-data:
  sonarr-v5-data:
  radarr-data:
  radarr-v5-data:
  radarr-v7-data:
  whisparr-data:
  readarr-data:
  lidarr-data:
  prowlarr-data:
