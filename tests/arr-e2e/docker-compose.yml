# Shared API key for all fixtures (must match config.ts E2E_API_KEY).
# Named volumes hold the DBs; only /data/e2e[-b] is bind-mounted, so PUID/PGID must be
# the host user (`PUID=$(id -u) PGID=$(id -g)`) or *arr rejects the root folders.
# Sonarr/Radarr/Readarr/Lidarr/Prowlarr take their API key from `<APP>__AUTH__*`.
# Whisparr's eros base ignores env overrides, so it seeds a fixture config.xml instead.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - SONARR__APP__INSTANCENAME=Sonarr
      - SONARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - SONARR__AUTH__METHOD=External
      - SONARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - sonarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "18989:8989"

  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - RADARR__APP__INSTANCENAME=Radarr
      - RADARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - radarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "17878:7878"

  # Whisparr v3 (eros) is the image upstream recommends. Its base predates the sectioned env
  # overrides and generates a random API key, so the fixture config.xml is copied into the
  # volume before the app starts. The v2 line (v2-2.2.0-release.231) passes this suite too.
  whisparr:
    image: ghcr.io/hotio/whisparr:v3-3.5.0-release.1585
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - whisparr-data:/config
      - ./fixtures/whisparr-config/config.xml:/seed/config.xml:ro
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    entrypoint: ["/bin/sh", "-c", 'cp /seed/config.xml /config/config.xml && chown "$$PUID:$$PGID" /config/config.xml && exec /init']
    ports:
      - "16969:6969"

  readarr:
    image: lscr.io/linuxserver/readarr:develop-0.4.3.2665-ls130
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - READARR__APP__INSTANCENAME=Readarr
      - READARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - READARR__AUTH__METHOD=External
      - READARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - readarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "18787:8787"

  # Nightly required for protocol items[] (#481)
  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - LIDARR__APP__INSTANCENAME=Lidarr
      - LIDARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - LIDARR__AUTH__METHOD=External
      - LIDARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - lidarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "18686:8686"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - PROWLARR__APP__INSTANCENAME=Prowlarr
      - PROWLARR__AUTH__APIKEY=e2etestapikey0123456789abcdef012
      - PROWLARR__AUTH__METHOD=External
      - PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - prowlarr-data:/config
      - ./fixtures/media/e2e:/data/e2e
      - ./fixtures/media/e2e-b:/data/e2e-b
    ports:
      - "19696:9696"

  # Indexer proxy for Prowlarr e2e (same image as examples/full). Not a download client.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    ports:
      - "18191:8191"

volumes:
  sonarr-data:
  radarr-data:
  whisparr-data:
  readarr-data:
  lidarr-data:
  prowlarr-data:
