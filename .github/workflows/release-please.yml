name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          fetch-depth: 0
          persist-credentials: false

      - name: git config
        run: |
          git config user.email "raydak-releaser@users.noreply.github.com"
          git config user.name "raydak-releaser[bot]"

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - id: prepare
        name: Update Nix release metadata
        env:
          RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          NIX_PNPM_DEPS_HASH="$(bash scripts/prefetch-nix-pnpm-deps.sh)"
          export NIX_PNPM_DEPS_HASH
          bash scripts/prepare-nix-release.sh "$version"

          if git diff --quiet; then
            exit 0
          fi

          git add pkgs/nix/package.nix
          git commit -m "chore: update Nix release metadata"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')"
          git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Run CI on the release branch
        env:
          RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] actionlint rejects `$/`
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docs:
    needs: [publish, release-please]
    uses: ./.github/workflows/documentation.yml # zizmor: ignore[self-repository] actionlint rejects `$/`
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      tag: ${{ needs.release-please.outputs.tag }}

  release-comments:
    needs: publish
    uses: ./.github/workflows/release-comment.yml # zizmor: ignore[self-repository] actionlint rejects `$/`
    permissions:
      issues: write
      pull-requests: write
