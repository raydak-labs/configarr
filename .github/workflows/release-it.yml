name: release-it

on:
  workflow_dispatch:

permissions: {}

jobs:
  # The tag pushed below immediately triggers the binary and Docker image releases,
  # so the exact tree that is about to be tagged has to pass the repo's own gates first.
  # This job runs without the releaser token on purpose: only `release` needs write access.
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # workflow_dispatch accepts no branch filter, so this assertion is what actually restricts a
      # release to main. It runs before checkout, and before the release token exists.
      - name: Ensure release is cut from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases may only be dispatched from main, got ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  release:
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          permission-contents: write
          permission-metadata: read

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: git config
        run: |
          git config user.email "raydak-releaser@users.noreply.github.com"
          git config user.name "raydak-releaser[bot]"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install

      - name: Configure git push credentials
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')"

      # The package builds the revision that contains pkgs/nix/package.nix, so a pinned
      # tag builds that tag. The pnpmDeps hash is written into the release commit
      # before the tag is created.
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Hash Nix pnpm dependencies
        id: nix_pnpm
        run: |
          hash="$(bash scripts/prefetch-nix-pnpm-deps.sh)"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      - run: pnpm release-it --ci
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NIX_PNPM_DEPS_HASH: ${{ steps.nix_pnpm.outputs.hash }}
