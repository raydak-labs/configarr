name: Arr E2E

# Optional: run manually from Actions → Arr E2E → Run workflow
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: arr-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arr-e2e:
    name: Live *arr e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write
    env:
      IS_RELEASE_BRANCH: ${{ startsWith(github.ref_name, 'release-please--') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report pending status
        if: env.IS_RELEASE_BRANCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="Arr E2E" -f description="Running" -f target_url="$RUN_URL"

      - name: Setup repo tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore docker image cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arr-e2e-images.tar
          key: arr-e2e-images-${{ hashFiles('tests/arr-e2e/docker-compose.yml') }}

      - name: Load cached docker images
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker load -i "${RUNNER_TEMP}/arr-e2e-images.tar"
          echo "image-cache: hit, docker load $(( $(date +%s) - start ))s, tar $(du -h "${RUNNER_TEMP}/arr-e2e-images.tar" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pull docker images
        if: steps.image-cache.outputs.cache-hit != 'true'
        working-directory: tests/arr-e2e
        run: |
          set -euo pipefail
          start=$(date +%s)
          PUID="$(id -u)" PGID="$(id -g)" docker compose pull
          echo "image-cache: miss, docker compose pull $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          docker compose config --images | sort -u | xargs docker save -o "${RUNNER_TEMP}/arr-e2e-images.tar"
          echo "image-cache: docker save $(( $(date +%s) - start ))s, tar $(du -h "${RUNNER_TEMP}/arr-e2e-images.tar" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker compose config --images | sort -u | xargs -n1 docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save docker image cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arr-e2e-images.tar
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: Start *arr stack
        working-directory: tests/arr-e2e
        run: |
          set -euo pipefail
          start=$(date +%s)
          # Containers must run as the runner user: /data/e2e is a bind mount from the
          # checkout, and *arr rejects a root folder it cannot write to.
          PUID="$(id -u)" PGID="$(id -g)" docker compose up -d
          echo "compose up $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for *arr APIs
        env:
          API_KEY: e2etestapikey0123456789abcdef012
        run: |
          set -euo pipefail
          wait_one() {
            name="$1"
            url="$2"
            path="$3"
            i=0
            while [ "$i" -lt 90 ]; do
              i=$((i + 1))
              if curl -sf -H "X-Api-Key: ${API_KEY}" "${url}${path}" >/dev/null; then
                echo "${name} ready (${i})"
                return 0
              fi
              sleep 2
            done
            echo "${name} failed to become ready"
            docker compose -f tests/arr-e2e/docker-compose.yml logs --tail 80 "${name}" || true
            return 1
          }
          wait_one sonarr   http://127.0.0.1:18989 /api/v3/system/status
          wait_one sonarr-v5 http://127.0.0.1:18990 /api/v5/system/status
          wait_one radarr   http://127.0.0.1:17878 /api/v3/system/status
          wait_one radarr-v5 http://127.0.0.1:17879 /api/v3/system/status
          wait_one radarr-v7 http://127.0.0.1:17880 /api/v3/system/status
          wait_one whisparr http://127.0.0.1:16969 /api/v3/system/status
          wait_one readarr  http://127.0.0.1:18787 /api/v1/system/status
          wait_one lidarr   http://127.0.0.1:18686 /api/v1/system/status
          wait_one prowlarr http://127.0.0.1:19696 /api/v1/system/status
          wait_one flaresolverr http://127.0.0.1:18191 /

      - name: Run arr e2e suite
        run: pnpm test:e2e:arr

      - name: Dump compose logs on failure
        if: failure()
        working-directory: tests/arr-e2e
        run: docker compose logs --tail 200

      - name: Stop *arr stack
        if: always()
        working-directory: tests/arr-e2e
        run: docker compose down -v

      - name: Report final status
        if: always() && env.IS_RELEASE_BRANCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="Arr E2E" -f description="Live *arr e2e: ${state}" -f target_url="$RUN_URL"
