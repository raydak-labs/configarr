name: Arr E2E

# Optional: run manually from Actions → Arr E2E → Run workflow
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: arr-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arr-e2e:
    name: Live *arr e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Start *arr stack
        working-directory: tests/arr-e2e
        run: |
          set -euo pipefail
          # Containers must run as the runner user: /data/e2e is a bind mount from the
          # checkout, and *arr rejects a root folder it cannot write to.
          PUID="$(id -u)" PGID="$(id -g)" docker compose up -d

      - name: Wait for *arr APIs
        env:
          API_KEY: e2etestapikey0123456789abcdef012
        run: |
          set -euo pipefail
          wait_one() {
            name="$1"
            url="$2"
            path="$3"
            i=0
            while [ "$i" -lt 90 ]; do
              i=$((i + 1))
              if curl -sf -H "X-Api-Key: ${API_KEY}" "${url}${path}" >/dev/null; then
                echo "${name} ready (${i})"
                return 0
              fi
              sleep 2
            done
            echo "${name} failed to become ready"
            docker compose -f tests/arr-e2e/docker-compose.yml logs --tail 80 "${name}" || true
            return 1
          }
          wait_one sonarr   http://127.0.0.1:18989 /api/v3/system/status
          wait_one radarr   http://127.0.0.1:17878 /api/v3/system/status
          wait_one whisparr http://127.0.0.1:16969 /api/v3/system/status
          wait_one readarr  http://127.0.0.1:18787 /api/v1/system/status
          wait_one lidarr   http://127.0.0.1:18686 /api/v1/system/status
          wait_one prowlarr http://127.0.0.1:19696 /api/v1/system/status
          wait_one flaresolverr http://127.0.0.1:18191 /

      - name: Run arr e2e suite
        run: pnpm test:e2e:arr

      - name: Dump compose logs on failure
        if: failure()
        working-directory: tests/arr-e2e
        run: docker compose logs --tail 200

      - name: Stop *arr stack
        if: always()
        working-directory: tests/arr-e2e
        run: docker compose down -v
