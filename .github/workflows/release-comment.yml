name: Release Comment

on:
  release:
    types: [published]
  # release-please calls this explicitly because GITHUB_TOKEN releases emit no release event.
  workflow_call:

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: apexskier/github-release-commenter@e7813a9625eabd79a875b4bc4046cfcae377ab34 # v1.4.1
