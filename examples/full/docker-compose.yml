services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - sonarr:/config
      - sonarr-download1:/downloads/1
      - sonarr-download2:/downloads/2
      - ${PWD}/sonarr.xml:/config/config.xml:rw
    ports:
      - 6500:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - radarr:/config
      - radarr-download1:/downloads/1
      - radarr-download2:/downloads/2
      - ${PWD}/radarr.xml:/config/config.xml:rw
    ports:
      - 6501:7878
    restart: unless-stopped

  # experimental
  whisparr:
    image: ghcr.io/hotio/whisparr:v3-3.5.0-release.1585
    networks:
      - configarr-full
    ports:
      - "6502:6969"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - whisparr:/config
      - whisparr-download1:/downloads/1
      - whisparr-download2:/downloads/2
      - ${PWD}/whisparr.xml:/config/config.xml:rw
    entrypoint: ["/bin/sh", "-c", "mkdir -p /config/library && chown 1000:1000 /config/library && exec /init"]
    restart: unless-stopped

  # experimental
  readarr:
    image: lscr.io/linuxserver/readarr:develop-0.4.3.2665-ls130
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - readarr:/config
      - readarr-download1:/downloads/1
      - readarr-download2:/downloads/2
      - ${PWD}/readarr.xml:/config/config.xml:rw
    ports:
      - 6503:8787
    restart: unless-stopped

  # experimental
  lidarr:
    image: lscr.io/linuxserver/lidarr:2.14.5
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - lidarr:/config
      - lidarr-download1:/downloads/1
      - lidarr-download2:/downloads/2
      - ${PWD}/lidarr.xml:/config/config.xml:rw
    ports:
      - 6504:8686
    restart: unless-stopped

  # experimental
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr:/config
      - ${PWD}/prowlarr.xml:/config/config.xml:rw
    ports:
      - 6505:9696
    restart: unless-stopped

  # used by the Prowlarr indexer-proxy example
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    networks:
      - configarr-full
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

networks:
  configarr-full:
    name: configarr-full

volumes:
  sonarr:
  radarr:
  whisparr:
  readarr:
  lidarr:
  prowlarr:
  sonarr-download1:
  sonarr-download2:
  radarr-download1:
  radarr-download2:
  whisparr-download1:
  whisparr-download2:
  readarr-download1:
  readarr-download2:
  lidarr-download1:
  lidarr-download2:
