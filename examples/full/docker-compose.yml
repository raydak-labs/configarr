services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SONARR__APP__INSTANCENAME=Sonarr
      - SONARR__AUTH__APIKEY=5e792b7e0fe14f58b8e92bf0902d4a44
      - SONARR__AUTH__REQUIRED=DisabledForLocalAddresses
      - SONARR__AUTH__METHOD=Forms
    volumes:
      - sonarr:/config
      - sonarr-download1:/downloads/1
      - sonarr-download2:/downloads/2
    ports:
      - 6500:8989
    restart: unless-stopped

  # Sonarr v5 develop, same pin as the e2e suite. Keep its config volume separate from v4.
  sonarr-v5:
    image: lscr.io/linuxserver/sonarr:develop-5.0.0.2941-ls207@sha256:b0cb42e70dd48860bbf3a8aa87dfa8c1a6ae56c1c96c8200923e821caad72a59
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SONARR__APP__INSTANCENAME=Sonarr v5
      - SONARR__AUTH__APIKEY=6f0e8641a9d94205b7b4578b23354a19
      - SONARR__AUTH__REQUIRED=DisabledForLocalAddresses
      - SONARR__AUTH__METHOD=Forms
    volumes:
      - sonarr-v5:/config
      - sonarr-download1:/downloads/1
      - sonarr-download2:/downloads/2
    ports:
      - 6506:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - RADARR__APP__INSTANCENAME=Radarr
      - RADARR__AUTH__APIKEY=0daa3a2b940f4e08bac991e9a30e9e12
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
      - RADARR__AUTH__METHOD=Forms
    volumes:
      - radarr:/config
      - radarr-download1:/downloads/1
      - radarr-download2:/downloads/2
    ports:
      - 6501:7878
    restart: unless-stopped

  # Radarr v7 develop (7.0.0.10815), same pin as the e2e suite. Isolated from the v6 database.
  radarr-v7:
    image: lscr.io/linuxserver/radarr:develop-7.0.0.10815-ls275@sha256:3aae9e841647fb54777ca38fab50cb5b1fdeec8a4b6aca252583a354be1a442e
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - RADARR__APP__INSTANCENAME=Radarr v7
      - RADARR__AUTH__APIKEY=d079c65e74fc41c793d5653d189073d8
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
      - RADARR__AUTH__METHOD=Forms
    volumes:
      - radarr-v7:/config
      - radarr-download1:/downloads/1
      - radarr-download2:/downloads/2
    ports:
      - 6507:7878
    restart: unless-stopped

  # experimental
  # Whisparr's eros base ignores env overrides and generates a random API key, so
  # whisparr.xml is copied into the volume before the app starts.
  whisparr:
    image: ghcr.io/hotio/whisparr:v3-3.6.5-release.1886
    networks:
      - configarr-full
    ports:
      - "6502:6969"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - whisparr:/config
      - whisparr-download1:/downloads/1
      - whisparr-download2:/downloads/2
      - ./whisparr.xml:/seed/config.xml:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "cp /seed/config.xml /config/config.xml && chown 1000:1000 /config/config.xml && mkdir -p /config/library && chown 1000:1000 /config/library && exec /init",
      ]
    restart: unless-stopped

  # experimental
  readarr:
    image: lscr.io/linuxserver/readarr:develop-0.4.18.2805-ls157
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - READARR__APP__INSTANCENAME=Readarr
      - READARR__AUTH__APIKEY=e001718ba38a424d8aae7cb391b5d27a
      - READARR__AUTH__REQUIRED=DisabledForLocalAddresses
      - READARR__AUTH__METHOD=Forms
    volumes:
      - readarr:/config
      - readarr-download1:/downloads/1
      - readarr-download2:/downloads/2
    ports:
      - 6503:8787
    restart: unless-stopped

  # experimental
  lidarr:
    image: lscr.io/linuxserver/lidarr:2.14.5
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - LIDARR__APP__INSTANCENAME=Lidarr
      - LIDARR__AUTH__APIKEY=713067b7319045df9c7fa6847d8ce717
      - LIDARR__AUTH__REQUIRED=DisabledForLocalAddresses
      - LIDARR__AUTH__METHOD=Forms
    volumes:
      - lidarr:/config
      - lidarr-download1:/downloads/1
      - lidarr-download2:/downloads/2
    ports:
      - 6504:8686
    restart: unless-stopped

  # experimental
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
    networks:
      - configarr-full
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PROWLARR__APP__INSTANCENAME=Prowlarr
      - PROWLARR__AUTH__APIKEY=a1b2c3d4e5f6470891234567890abcde
      - PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses
      - PROWLARR__AUTH__METHOD=Forms
    volumes:
      - prowlarr:/config
    ports:
      - 6505:9696
    restart: unless-stopped

  # used by the Prowlarr indexer-proxy example
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    networks:
      - configarr-full
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

networks:
  configarr-full:
    name: configarr-full

volumes:
  sonarr:
  sonarr-v5:
  radarr:
  radarr-v7:
  whisparr:
  readarr:
  lidarr:
  prowlarr:
  sonarr-download1:
  sonarr-download2:
  radarr-download1:
  radarr-download2:
  whisparr-download1:
  whisparr-download2:
  readarr-download1:
  readarr-download2:
  lidarr-download1:
  lidarr-download2:
