services:
  configarr:
    container_name: configarr-reused
    image: ghcr.io/raydak-labs/configarr:latest@sha256:0e14337fef1c2c0193537b6ea301b52c464ef0718a6f5165ebc7334d7fd10451
    networks:
      - configarr-full
    volumes:
      - ./config:/app/config
      - ./dockerrepos:/app/repos
      #- ./cfs:/app/cfs
      #- ./templates:/app/templates

  ofelia:
    image: mcuadros/ofelia:latest@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    command: daemon --config=/opt/config.ini
    #command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia.ini:/opt/config.ini

networks:
  configarr-full:
    name: configarr-full
    external: true
